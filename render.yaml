# Configurazione Render ("Blueprint").
# Costo: sito 7 $/mese + disco backup 1 GB 0,25 $/mese. Il database è su Neon (piano gratuito).
services:
  - type: web
    name: casteltech-portale
    runtime: node
    plan: 0.5c-512mb          # 7 $/mese, sempre acceso
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /salute
    autoDeploy: true            # ogni modifica salvata su GitHub (ramo main) viene pubblicata da sola
    disk:
      name: backup
      mountPath: /var/data
      sizeGB: 1                 # copie notturne del database (ultimi 30 giorni)
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: BACKUP_DIR
        value: /var/data/backup
      - key: DATABASE_URL
        sync: false             # chiesto alla creazione: stringa di connessione del database Neon
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false             # chiesto alla creazione: email del primo utente ufficio
      - key: ADMIN_PASSWORD
        sync: false             # chiesto alla creazione: password del primo utente ufficio
      - key: ADMIN_NOME
        value: Adriano Gambi
