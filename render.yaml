# Configurazione Render ("Blueprint").
# Costo: portale 7 $/mese + disco backup 1 GB 0,25 $/mese. Il database è su Neon (piano gratuito).
services:
  - type: web
    name: casteltech-portale
    runtime: node
    plan: 0.5c-512mb          # 7 $/mese, sempre acceso
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /salute
    autoDeploy: true            # ogni modifica salvata su GitHub (ramo main) viene pubblicata da sola
    buildFilter:
      ignoredPaths:
        - sito/**               # le modifiche al sito pubblicano solo il sito, non riavviano il portale
    disk:
      name: backup
      mountPath: /var/data
      sizeGB: 1                 # copie notturne del database (ultimi 30 giorni)
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: BACKUP_DIR
        value: /var/data/backup
      - key: DATABASE_URL
        sync: false             # chiesto alla creazione: stringa di connessione del database Neon
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false             # chiesto alla creazione: email del primo utente ufficio
      - key: ADMIN_PASSWORD
        sync: false             # chiesto alla creazione: password del primo utente ufficio
      - key: ADMIN_NOME
        value: Adriano Gambi
      - key: ANTHROPIC_API_KEY
        sync: false             # inserita a mano su Render: lettura automatica delle schede scansionate
      - key: GMAIL_ADDON_CHIAVE
        sync: false             # frase lunga a caso, uguale a PORTALE_CHIAVE del pannello di Gmail (tools/gmail-addon)
      # distributori per prezzi e disponibilità dei componenti (Impostazioni → Componenti): tutte facoltative
      - key: DIGIKEY_CLIENT_ID
        sync: false
      - key: DIGIKEY_CLIENT_SECRET
        sync: false
      - key: MOUSER_API_KEY
        sync: false
      - key: FARNELL_API_KEY
        sync: false
      - key: TME_APP_TOKEN
        sync: false
      - key: TME_APP_SECRET
        sync: false

  # Sito casteltech.net (Adriano, 2/11/2026: da WordPress su Noamweb a pagine statiche, gratis su Render).
  # Pagine in sito/pubblico; i moduli Contatti e Preventivo li riceve il portale (/api/sito/..., src/server/rotte/sito.ts).
  - type: web
    name: casteltech-sito
    runtime: static
    buildCommand: echo "pagine statiche, niente da costruire"
    staticPublishPath: ./sito/pubblico
    autoDeploy: true
    buildFilter:
      paths:
        - sito/**
    headers:
      - path: /wp-content/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /wp-includes/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # indirizzi di WordPress che non esistono più: alla pagina iniziale (rimando permanente, non si perde posizionamento)
      - type: redirect
        source: /index.php
        destination: /
      - type: redirect
        source: /feed/*
        destination: /
      - type: redirect
        source: /wp-admin/*
        destination: /
      - type: redirect
        source: /wp-login.php
        destination: /
      - type: redirect
        source: /en/feed/*
        destination: /en/
